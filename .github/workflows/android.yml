name: Android AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v4

    - name: Decode keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/my-upload-key.jks

    - name: Restore google-services.json
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

    - name: Restore .env
      run: echo "${{ secrets.ENV_FILE }}" > .env

    - name: Build release AAB
      run: |
        chmod +x gradlew
        ./gradlew bundleRelease --stacktrace
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - uses: actions/upload-artifact@v4
      with:
        name: smart-calculator-aab
        path: app/build/outputs/bundle/release/*.aab
